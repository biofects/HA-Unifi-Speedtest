start_speed_test:
  name: Start Speed Test
  description: Manually start a speed test on the UniFi controller
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID for the specific UniFi controller (optional - will use first available if not specified)
      required: false
      example: "01234567890abcdef"
      selector:
        text:
    interface_name:
      name: Interface Name
      description: Specific WAN interface to test (e.g., 'eth9', 'eth8'). Leave empty to test all WANs if multi-WAN is enabled.
      required: false
      example: "eth9"
      selector:
        text:

get_speed_test_status:
  name: Get Speed Test Status
  description: Retrieve the current speed test results from the UniFi controller
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID for the specific UniFi controller (optional - will use first available if not specified)
      required: false
      example: "01234567890abcdef"
      selector:
        text:

get_wan_interfaces:
  name: Get WAN Interfaces
  description: Retrieve list of available WAN interfaces from the UDM controller
  fields:
    config_entry_id:
      name: Config Entry ID
      description: The configuration entry ID for the specific UniFi controller (optional - will use first available if not specified)
      required: false
      example: "01234567890abcdef"
      selector:
        text:
